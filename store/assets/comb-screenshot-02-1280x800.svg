<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Comb Creator Attribution Guarantee</title>
  <desc id="desc">A synthetic before-and-after proof shows that creator affiliate URL parameters and the attribution cookie remain unchanged after coupon testing</desc>
  <defs>
    <linearGradient id="background" x1="30" y1="20" x2="1250" y2="790" gradientUnits="userSpaceOnUse">
      <stop stop-color="#123629"/>
      <stop offset="0.56" stop-color="#0b241b"/>
      <stop offset="1" stop-color="#071a14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1080 100) rotate(130) scale(620 540)">
      <stop stop-color="#71d39b" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#71d39b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f7dda0"/>
      <stop offset="1" stop-color="#d4a84f"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="800" fill="url(#background)"/>
  <rect width="1280" height="800" fill="url(#glow)"/>
  <g opacity="0.1" fill="none" stroke="#edc66f" stroke-width="2">
    <path d="M89 64 124 84v40l-35 20-35-20V84z"/>
    <path d="M119 135 154 155v40l-35 20-35-20v-40z"/>
    <path d="M59 135 94 155v40l-35 20-35-20v-40z"/>
    <path d="M1184 613 1219 633v40l-35 20-35-20v-40z"/>
    <path d="M1154 684 1189 704v40l-35 20-35-20v-40z"/>
    <path d="M1214 684 1249 704v40l-35 20-35-20v-40z"/>
  </g>

  <g transform="translate(82 70)">
    <path d="M32 0 62 17v35L32 70 2 52V17z" fill="#0b241b" stroke="url(#brass)" stroke-width="3"/>
    <text x="20" y="48" fill="#edc66f" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="800">C</text>
    <text x="80" y="25" fill="#edc66f" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" letter-spacing="2">PRIVATE COUPON TESTER</text>
    <text x="80" y="57" fill="#fff7e2" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="800">Comb</text>
  </g>

  <text x="82" y="224" fill="#fff7e2" font-family="DejaVu Sans, sans-serif" font-size="43" font-weight="800">Creator credit</text>
  <text x="82" y="272" fill="#fff7e2" font-family="DejaVu Sans, sans-serif" font-size="43" font-weight="800">stays theirs.</text>
  <text x="82" y="326" fill="#a7ebc1" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="750">The tagging issue is fixed.</text>
  <text x="82" y="388" fill="#b8c7be" font-family="DejaVu Sans, sans-serif" font-size="18">Comb has no affiliate identity and never rewrites</text>
  <text x="82" y="420" fill="#b8c7be" font-family="DejaVu Sans, sans-serif" font-size="18">referral parameters or attribution cookies.</text>

  <g transform="translate(82 472)">
    <circle cx="13" cy="13" r="13" fill="#71d39b"/>
    <path d="m7 13 4 4 8-9" fill="none" stroke="#071a14" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>
    <text x="40" y="18" fill="#fff7e2" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700">No cookie or traffic-redirection permission</text>
    <circle cx="13" cy="67" r="13" fill="#71d39b"/>
    <path d="m7 67 4 4 8-9" fill="none" stroke="#071a14" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>
    <text x="40" y="72" fill="#fff7e2" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700">No hidden referral tabs or Comb tracking links</text>
    <circle cx="13" cy="121" r="13" fill="#71d39b"/>
    <path d="m7 121 4 4 8-9" fill="none" stroke="#071a14" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>
    <text x="40" y="126" fill="#fff7e2" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700">Required real-Chrome URL + cookie contract</text>
  </g>

  <rect x="618" y="54" width="586" height="692" rx="30" fill="#000" fill-opacity="0.26"/>
  <g transform="translate(642 76)">
    <rect width="538" height="646" rx="22" fill="#081d16" stroke="#edc66f" stroke-opacity="0.3"/>
    <g transform="translate(28 26)">
      <circle cx="20" cy="20" r="20" fill="#71d39b"/>
      <path d="m11 20 6 6 13-15" fill="none" stroke="#071a14" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/>
      <text x="58" y="17" fill="#edc66f" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="800" letter-spacing="1.8">CREATOR ATTRIBUTION GUARANTEE</text>
      <text x="58" y="45" fill="#fff7e2" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="800">Protected before, during, and after</text>

      <g transform="translate(0 82)">
        <rect width="482" height="112" rx="14" fill="#fff" fill-opacity="0.045" stroke="#edc66f" stroke-opacity="0.2"/>
        <text x="18" y="28" fill="#edc66f" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="800" letter-spacing="1.4">BEFORE COMB</text>
        <text x="18" y="57" fill="#fff7e2" font-family="DejaVu Sans Mono, monospace" font-size="12">shop.demo/checkout?</text>
        <text x="18" y="80" fill="#a7ebc1" font-family="DejaVu Sans Mono, monospace" font-size="12">affiliate_id=creator-42&amp;utm_source=creator</text>
        <rect x="390" y="18" width="74" height="25" rx="13" fill="#71d39b" fill-opacity="0.12" stroke="#71d39b" stroke-opacity="0.35"/>
        <text x="405" y="34" fill="#a7ebc1" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="800">ORIGINAL</text>
      </g>

      <g transform="translate(0 210)">
        <rect width="482" height="112" rx="14" fill="#71d39b" fill-opacity="0.07" stroke="#71d39b" stroke-opacity="0.35"/>
        <text x="18" y="28" fill="#71d39b" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="800" letter-spacing="1.4">AFTER COUPON TEST</text>
        <text x="18" y="57" fill="#fff7e2" font-family="DejaVu Sans Mono, monospace" font-size="12">shop.demo/checkout?</text>
        <text x="18" y="80" fill="#a7ebc1" font-family="DejaVu Sans Mono, monospace" font-size="12">affiliate_id=creator-42&amp;utm_source=creator</text>
        <rect x="382" y="18" width="82" height="25" rx="13" fill="#71d39b"/>
        <text x="394" y="34" fill="#071a14" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="900">UNCHANGED</text>
      </g>

      <g transform="translate(0 338)">
        <rect width="482" height="94" rx="14" fill="#fff" fill-opacity="0.045" stroke="#edc66f" stroke-opacity="0.2"/>
        <text x="18" y="28" fill="#edc66f" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="800" letter-spacing="1.4">ATTRIBUTION COOKIE</text>
        <text x="18" y="59" fill="#fff7e2" font-family="DejaVu Sans Mono, monospace" font-size="12">creator_attribution=creator-42</text>
        <text x="386" y="59" fill="#a7ebc1" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="800">UNCHANGED ✓</text>
      </g>

      <g transform="translate(0 451)">
        <rect width="482" height="104" rx="14" fill="#d4a84f" fill-opacity="0.09" stroke="#edc66f" stroke-opacity="0.34"/>
        <text x="20" y="32" fill="#fff7e2" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="800">Proper attribution remains with the original creator.</text>
        <text x="20" y="58" fill="#b8c7be" font-family="DejaVu Sans, sans-serif" font-size="11">Synthetic evidence. Comb does not inspect live creator identities.</text>
        <text x="20" y="80" fill="#b8c7be" font-family="DejaVu Sans, sans-serif" font-size="11">It protects them by having no mechanism to alter attribution.</text>
      </g>
    </g>
  </g>
  <text x="1175" y="775" text-anchor="end" fill="#82958b" font-family="DejaVu Sans, sans-serif" font-size="10">Synthetic attribution contract · Comb v0.8</text>
</svg>
