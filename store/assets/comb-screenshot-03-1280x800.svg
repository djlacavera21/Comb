<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Comb verified coupon results</title>
  <desc id="desc">The Comb popup shows a best verified coupon, measured savings, the final checkout total, and results for each tested code</desc>
  <defs>
    <linearGradient id="background" x1="35" y1="20" x2="1240" y2="785" gradientUnits="userSpaceOnUse">
      <stop stop-color="#123629"/>
      <stop offset="0.55" stop-color="#0b241b"/>
      <stop offset="1" stop-color="#071a14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1060 92) rotate(128) scale(600 530)">
      <stop stop-color="#d4a84f" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#d4a84f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f7dda0"/>
      <stop offset="1" stop-color="#d4a84f"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="800" fill="url(#background)"/>
  <rect width="1280" height="800" fill="url(#glow)"/>
  <g opacity="0.1" fill="none" stroke="#edc66f" stroke-width="2">
    <path d="M90 66 125 86v40l-35 20-35-20V86z"/>
    <path d="M120 137 155 157v40l-35 20-35-20v-40z"/>
    <path d="M60 137 95 157v40l-35 20-35-20v-40z"/>
    <path d="M1188 614 1223 634v40l-35 20-35-20v-40z"/>
    <path d="M1158 685 1193 705v40l-35 20-35-20v-40z"/>
  </g>

  <g transform="translate(82 70)">
    <path d="M32 0 62 17v35L32 70 2 52V17z" fill="#0b241b" stroke="url(#brass)" stroke-width="3"/>
    <text x="20" y="48" fill="#edc66f" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="800">C</text>
    <text x="80" y="25" fill="#edc66f" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" letter-spacing="2">PRIVATE COUPON TESTER</text>
    <text x="80" y="57" fill="#fff7e2" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="800">Comb</text>
  </g>

  <text x="82" y="224" fill="#fff7e2" font-family="DejaVu Sans, sans-serif" font-size="46" font-weight="800">Best code, verified.</text>
  <text x="82" y="276" fill="#a7ebc1" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="750">Savings measured on the real total.</text>
  <text x="82" y="340" fill="#b8c7be" font-family="DejaVu Sans, sans-serif" font-size="18">Comb tests one code at a time, restores the cart</text>
  <text x="82" y="372" fill="#b8c7be" font-family="DejaVu Sans, sans-serif" font-size="18">between attempts, then reapplies the best result.</text>

  <g transform="translate(82 438)">
    <circle cx="13" cy="13" r="13" fill="#71d39b"/>
    <path d="m7 13 4 4 8-9" fill="none" stroke="#071a14" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>
    <text x="40" y="18" fill="#fff7e2" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700">Sequential coupon attempts—never stacked</text>
    <circle cx="13" cy="67" r="13" fill="#71d39b"/>
    <path d="m7 67 4 4 8-9" fill="none" stroke="#071a14" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>
    <text x="40" y="72" fill="#fff7e2" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700">Currency and payable total verified</text>
    <circle cx="13" cy="121" r="13" fill="#71d39b"/>
    <path d="m7 121 4 4 8-9" fill="none" stroke="#071a14" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>
    <text x="40" y="126" fill="#fff7e2" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700">Stops before purchase or ambiguous controls</text>
  </g>

  <rect x="692" y="42" width="512" height="724" rx="36" fill="#000" fill-opacity="0.3"/>
  <g transform="translate(716 54)">
    <rect width="464" height="692" rx="22" fill="#081d16" stroke="#edc66f" stroke-opacity="0.25"/>
    <g transform="translate(24 20)">
      <path d="M22 0 42 12v23L22 47 2 35V12z" fill="#0b241b" stroke="url(#brass)" stroke-width="2.2"/>
      <text x="14" y="33" fill="#edc66f" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="800">C</text>
      <text x="58" y="16" fill="#edc66f" font-family="DejaVu Sans, sans-serif" font-size="8" font-weight="700" letter-spacing="1.2">PRIVATE COUPON TESTER</text>
      <text x="58" y="40" fill="#fff7e2" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="800">Comb</text>

      <g transform="translate(0 63)">
        <rect width="416" height="62" rx="12" fill="#71d39b" fill-opacity="0.09" stroke="#71d39b" stroke-opacity="0.32"/>
        <circle cx="23" cy="22" r="10" fill="#71d39b"/>
        <path d="m18 22 3 3 6-7" fill="none" stroke="#071a14" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4"/>
        <text x="42" y="20" fill="#a7ebc1" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="800">Creator attribution protected</text>
        <text x="42" y="40" fill="#bcd9c8" font-family="DejaVu Sans, sans-serif" font-size="9.5">No affiliate tag, referral link, or cookie was changed.</text>
      </g>

      <g transform="translate(0 140)">
        <rect width="416" height="86" rx="13" fill="#fff" fill-opacity="0.045" stroke="#edc66f" stroke-opacity="0.2"/>
        <text x="16" y="24" fill="#edc66f" font-family="DejaVu Sans, sans-serif" font-size="8" font-weight="800" letter-spacing="1.2">SYNTHETIC CHECKOUT</text>
        <text x="16" y="48" fill="#fff7e2" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="800">demo.checkout.local</text>
        <text x="16" y="70" fill="#b8c7be" font-family="DejaVu Sans, sans-serif" font-size="10">Original total</text>
        <text x="342" y="70" fill="#f7dda0" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="800">$132.95</text>
      </g>

      <g transform="translate(0 241)">
        <rect width="416" height="99" rx="14" fill="#71d39b" fill-opacity="0.1" stroke="#71d39b" stroke-opacity="0.4"/>
        <text x="18" y="28" fill="#71d39b" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="800" letter-spacing="1.2">BEST VERIFIED CODE</text>
        <text x="18" y="58" fill="#fff7e2" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="900">WELCOME20 saves $26.60</text>
        <text x="18" y="81" fill="#bcd9c8" font-family="DejaVu Sans, sans-serif" font-size="10.5">Best code left applied · Final detected total: $106.35</text>
      </g>

      <g transform="translate(0 356)">
        <text x="0" y="12" fill="#edc66f" font-family="DejaVu Sans, sans-serif" font-size="8" font-weight="800" letter-spacing="1.2">TEST RESULTS</text>
        <rect y="25" width="416" height="176" rx="12" fill="#000" fill-opacity="0.22" stroke="#edc66f" stroke-opacity="0.18"/>
        <line x1="16" x2="400" y1="69" y2="69" stroke="#edc66f" stroke-opacity="0.12"/>
        <line x1="16" x2="400" y1="113" y2="113" stroke="#edc66f" stroke-opacity="0.12"/>
        <line x1="16" x2="400" y1="157" y2="157" stroke="#edc66f" stroke-opacity="0.12"/>
        <text x="16" y="53" fill="#fff7e2" font-family="DejaVu Sans Mono, monospace" font-size="12">SAVE10</text>
        <text x="311" y="53" fill="#a7ebc1" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700">saved $13.30</text>
        <text x="16" y="97" fill="#fff7e2" font-family="DejaVu Sans Mono, monospace" font-size="12" font-weight="800">WELCOME20</text>
        <text x="311" y="97" fill="#a7ebc1" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="800">saved $26.60</text>
        <text x="16" y="141" fill="#fff7e2" font-family="DejaVu Sans Mono, monospace" font-size="12">FREESHIP</text>
        <text x="325" y="141" fill="#8fa097" font-family="DejaVu Sans, sans-serif" font-size="11">no savings</text>
        <text x="16" y="185" fill="#fff7e2" font-family="DejaVu Sans Mono, monospace" font-size="12">NOTREAL</text>
        <text x="325" y="185" fill="#8fa097" font-family="DejaVu Sans, sans-serif" font-size="11">no savings</text>
      </g>

      <g transform="translate(0 575)">
        <rect width="416" height="48" rx="10" fill="url(#brass)"/>
        <text x="88" y="30" fill="#071a14" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="900">Review checkout before placing order</text>
        <text x="0" y="75" fill="#82958b" font-family="DejaVu Sans, sans-serif" font-size="8.5">No tracking. No affiliate swap. No purchase clicks.</text>
      </g>
    </g>
  </g>
  <text x="1177" y="779" text-anchor="end" fill="#82958b" font-family="DejaVu Sans, sans-serif" font-size="10">Synthetic checkout shown · Comb v0.7</text>
</svg>
