      <text x="58" y="17" fill="#edc66f" font-family="DejaVu Sans, sans-serif" font-size="8" font-weight="800" letter-spacing="1.2">COMB SETTINGS</text>
      <text x="58" y="41" fill="#fff7e2" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="800">Community feeds</text>
      <rect x="396" y="8" width="110" height="29" rx="15" fill="#d4a84f" fill-opacity="0.1" stroke="#edc66f" stroke-opacity="0.25"/>
      <text x="414" y="27" fill="#f7dda0" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="800">1 feed · 1 key</text>

      <g transform="translate(0 66)">
        <rect width="508" height="62" rx="12" fill="#71d39b" fill-opacity="0.09" stroke="#71d39b" stroke-opacity="0.35"/>
        <circle cx="24" cy="22" r="10" fill="#71d39b"/>
        <path d="m19 22 3 3 6-7" fill="none" stroke="#071a14" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4"/>
        <text x="43" y="20" fill="#a7ebc1" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="800">Signature, expiry, schema, and sequence verified</text>
        <text x="43" y="40" fill="#bcd9c8" font-family="DejaVu Sans, sans-serif" font-size="9.5">Coupon tokens are available without affiliate links or executable code.</text>
      </g>

      <g transform="translate(0 143)">
        <text x="0" y="11" fill="#edc66f" font-family="DejaVu Sans, sans-serif" font-size="8" font-weight="800" letter-spacing="1.2">TRUSTED PUBLIC KEY</text>
        <rect y="24" width="508" height="94" rx="13" fill="#fff" fill-opacity="0.045" stroke="#edc66f" stroke-opacity="0.2"/>
        <text x="17" y="52" fill="#fff7e2" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="800">Comb Community</text>
        <text x="17" y="75" fill="#edc66f" font-family="DejaVu Sans Mono, monospace" font-size="10">P-256 · fingerprint 94be:52c1:8a70:3d11</text>
        <text x="17" y="97" fill="#8fa097" font-family="DejaVu Sans, sans-serif" font-size="9.5">Public key only · private signing material stays offline</text>
        <rect x="421" y="38" width="70" height="25" rx="13" fill="#71d39b" fill-opacity="0.12" stroke="#71d39b" stroke-opacity="0.3"/>
        <text x="438" y="54" fill="#a7ebc1" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="800">TRUSTED</text>
      </g>

      <g transform="translate(0 278)">
        <text x="0" y="11" fill="#edc66f" font-family="DejaVu Sans, sans-serif" font-size="8" font-weight="800" letter-spacing="1.2">SIGNED FEED</text>
        <rect y="24" width="508" height="102" rx="13" fill="#fff" fill-opacity="0.045" stroke="#edc66f" stroke-opacity="0.2"/>
        <text x="17" y="52" fill="#fff7e2" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="800">Community Savings</text>
        <text x="17" y="76" fill="#b8c7be" font-family="DejaVu Sans, sans-serif" font-size="10">4 coupon codes · sequence 12 · expires Sep 30, 2026</text>
        <text x="17" y="99" fill="#a7ebc1" font-family="DejaVu Sans, sans-serif" font-size="9.5">Signer, feed identity, schema, and higher sequence verified</text>
        <rect x="419" y="38" width="72" height="25" rx="13" fill="#71d39b"/>
        <text x="433" y="54" fill="#071a14" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="900">VERIFIED</text>
      </g>

      <g transform="translate(0 422)">
        <text x="0" y="11" fill="#edc66f" font-family="DejaVu Sans, sans-serif" font-size="8" font-weight="800" letter-spacing="1.2">OPTIONAL APPROVED SOURCE</text>
        <rect y="24" width="508" height="112" rx="13" fill="#fff" fill-opacity="0.045" stroke="#edc66f" stroke-opacity="0.2"/>
        <text x="17" y="52" fill="#fff7e2" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="800">community-savings</text>
        <text x="17" y="76" fill="#edc66f" font-family="DejaVu Sans Mono, monospace" font-size="10">https://feeds.example.test/comb.json</text>
        <text x="17" y="99" fill="#b8c7be" font-family="DejaVu Sans, sans-serif" font-size="9.5">Verified just now · credentials and referrer omitted</text>
        <rect x="393" y="71" width="98" height="26" rx="13" fill="#d4a84f" fill-opacity="0.1" stroke="#edc66f" stroke-opacity="0.25"/>
        <text x="408" y="88" fill="#f7dda0" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="800">REMOVE ACCESS</text>
      </g>

      <g transform="translate(0 578)">
        <rect width="508" height="50" rx="11" fill="#d4a84f" fill-opacity="0.09" stroke="#edc66f" stroke-opacity="0.24"/>
        <text x="23" y="30" fill="#fff7e2" font-family="DejaVu Sans, sans-serif" font-size="11.5" font-weight="800">Coupon tokens only · No affiliate URLs · No remote code</text>
      </g>
    </g>
  </g>
  <text x="1177" y="779" text-anchor="end" fill="#82958b" font-family="DejaVu Sans, sans-serif" font-size="10">Synthetic settings state · Comb v0.8</text>
</svg>
