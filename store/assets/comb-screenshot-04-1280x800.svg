<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Comb signature-verified community coupon feeds</title>
  <desc id="desc">Comb settings show a trusted public key, a signature-verified coupon feed, and an optional approved update source</desc>
  <defs>
    <linearGradient id="background" x1="40" y1="20" x2="1235" y2="785" gradientUnits="userSpaceOnUse">
      <stop stop-color="#123629"/>
      <stop offset="0.55" stop-color="#0b241b"/>
      <stop offset="1" stop-color="#071a14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1060 98) rotate(130) scale(620 540)">
      <stop stop-color="#d4a84f" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#d4a84f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f7dda0"/>
      <stop offset="1" stop-color="#d4a84f"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="800" fill="url(#background)"/>
  <rect width="1280" height="800" fill="url(#glow)"/>
  <g opacity="0.1" fill="none" stroke="#edc66f" stroke-width="2">
    <path d="M90 66 125 86v40l-35 20-35-20V86z"/>
    <path d="M120 137 155 157v40l-35 20-35-20v-40z"/>
    <path d="M60 137 95 157v40l-35 20-35-20v-40z"/>
    <path d="M1187 614 1222 634v40l-35 20-35-20v-40z"/>
    <path d="M1157 685 1192 705v40l-35 20-35-20v-40z"/>
  </g>

  <g transform="translate(82 70)">
    <path d="M32 0 62 17v35L32 70 2 52V17z" fill="#0b241b" stroke="url(#brass)" stroke-width="3"/>
    <text x="20" y="48" fill="#edc66f" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="800">C</text>
    <text x="80" y="25" fill="#edc66f" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" letter-spacing="2">PRIVATE COUPON TESTER</text>
    <text x="80" y="57" fill="#fff7e2" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="800">Comb</text>
  </g>

  <text x="82" y="224" fill="#fff7e2" font-family="DejaVu Sans, sans-serif" font-size="43" font-weight="800">Trusted community</text>
  <text x="82" y="272" fill="#fff7e2" font-family="DejaVu Sans, sans-serif" font-size="43" font-weight="800">codes.</text>
  <text x="82" y="326" fill="#a7ebc1" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="750">Signed—not sponsored.</text>
  <text x="82" y="388" fill="#b8c7be" font-family="DejaVu Sans, sans-serif" font-size="18">Import coupon tokens from publishers you choose.</text>
  <text x="82" y="420" fill="#b8c7be" font-family="DejaVu Sans, sans-serif" font-size="18">Affiliate URLs and arbitrary metadata are rejected.</text>

  <g transform="translate(82 472)">
    <circle cx="13" cy="13" r="13" fill="#71d39b"/>
    <path d="m7 13 4 4 8-9" fill="none" stroke="#071a14" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>
    <text x="40" y="18" fill="#fff7e2" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700">ECDSA P-256 signature verification</text>
    <circle cx="13" cy="67" r="13" fill="#71d39b"/>
    <path d="m7 67 4 4 8-9" fill="none" stroke="#071a14" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>
    <text x="40" y="72" fill="#fff7e2" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700">Expiry, identity, and rollback protection</text>
    <circle cx="13" cy="121" r="13" fill="#71d39b"/>
    <path d="m7 121 4 4 8-9" fill="none" stroke="#071a14" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>
    <text x="40" y="126" fill="#fff7e2" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700">Optional origin access is revocable</text>
  </g>

  <rect x="596" y="42" width="608" height="724" rx="34" fill="#000" fill-opacity="0.3"/>
  <g transform="translate(620 58)">
    <rect width="560" height="692" rx="22" fill="#081d16" stroke="#edc66f" stroke-opacity="0.25"/>
    <g transform="translate(26 22)">
      <path d="M22 0 42 12v23L22 47 2 35V12z" fill="#0b241b" stroke="url(#brass)" stroke-width="2.2"/>
