<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <title>Magento Luma cart fixture</title>
    <link rel="stylesheet" href="fixture.css">
  </head>
  <body data-baseline="132.95" data-shipping="7.95" data-currency="EUR" data-locale="it-IT">
    <main>
      <h1>Magento Open Source Luma cart fixture</h1>
      <div class="block discount" id="block-discount">
        <div class="title" data-role="title">
          <strong id="block-discount-heading">Applica codice sconto</strong>
        </div>
        <div class="content" data-role="content" aria-labelledby="block-discount-heading">
          <form id="discount-coupon-form">
            <div class="fieldset coupon">
              <input type="hidden" name="remove" id="remove-coupon" value="0">
              <div class="field">
                <label for="coupon_code" class="label">Inserisci codice sconto</label>
                <div class="control">
                  <input class="input-text" id="coupon_code" name="coupon_code" type="text" data-fixture-input>
                </div>
              </div>
              <div class="actions-toolbar">
                <button class="action apply primary" type="button" data-fixture-apply>Applica sconto</button>
              </div>
              <p class="message" role="alert" data-fixture-status hidden></p>
              <div class="coupon-result" data-fixture-applied hidden>
                <span data-fixture-applied-code></span>
                <button class="action cancel primary" type="button" data-fixture-remove>Annulla coupon</button>
              </div>
            </div>
          </form>
        </div>
      </div>
      <table class="data table totals">
        <tbody>
          <tr class="totals sub">
            <th>Subtotale</th>
            <td class="amount"><span class="price">€ 120,00</span></td>
          </tr>
          <tr class="totals shipping excl">
            <th>Spedizione</th>
            <td class="amount"><span class="price">€ 7,95</span></td>
          </tr>
          <tr class="totals-tax">
            <th>Imposta</th>
            <td class="amount"><span class="price">€ 5,00</span></td>
          </tr>
          <tr class="grand totals">
            <th class="mark"><strong>Totale ordine</strong></th>
            <td class="amount"><strong><span class="price" data-fixture-total>€ 132,95</span></strong></td>
          </tr>
        </tbody>
      </table>
      <div class="danger-zone">
        <button class="action primary checkout" type="button" data-fixture-danger>Effettua ordine</button>
      </div>
    </main>
    <script src="../../src/content/checkout-engine.js"></script>
    <script src="fixture-runtime.js"></script>
  </body>
</html>
