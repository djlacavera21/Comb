<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Existing coupon fixture</title>
    <link rel="stylesheet" href="fixture.css">
  </head>
  <body data-baseline="132.95" data-currency="USD" data-locale="en-US" data-existing-coupon="true">
    <main>
      <h1>Existing coupon checkout fixture</h1>
      <form>
        <label for="existing-coupon-input">Coupon code</label>
        <input id="existing-coupon-input" name="coupon" type="text" data-fixture-input>
        <button type="button" data-fixture-apply>Apply coupon</button>
      </form>
      <p role="alert" data-fixture-status hidden></p>
      <div class="applied-coupon" data-fixture-applied hidden>
        <span data-fixture-applied-code></span>
        <button class="coupon-remove" type="button" aria-label="Remove coupon" data-fixture-remove>Remove coupon</button>
      </div>
      <div class="order-total" data-testid="order-total">
        <span>Order total</span>
        <strong data-fixture-total>$132.95</strong>
      </div>
    </main>
    <script src="../../src/content/checkout-engine.js"></script>
    <script src="fixture-runtime.js"></script>
  </body>
</html>
