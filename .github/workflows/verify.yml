name: Verify Comb

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Validate runtime, store disclosures, assets, and attribution boundary
        run: npm run lint
      - name: Run unit tests
        run: node --test tests/*.test.cjs
      - name: Run real-browser adapter and keyboard fixtures
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/run-browser-fixtures.js --require-browser
      - name: Set up Firefox
        id: firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest
      - name: Set up geckodriver
        uses: browser-actions/setup-geckodriver@latest
        with:
          token: ${{ github.token }}
      - name: Confirm synthetic HTTPS fixture support
        run: openssl version
      - name: Run real-Firefox checkout, attribution, signed-feed, permission, and alarm fixtures
        env:
          FIREFOX_PATH: ${{ steps.firefox.outputs.firefox-path }}
        run: node scripts/run-firefox-fixtures.js --require-browser
      - name: Build reproducible runtime and store review kit
        run: npm run release:build
      - name: Upload verified runtime and store review kit
        uses: actions/upload-artifact@v7
        with:
          name: comb-${{ github.sha }}-store-package
          path: |
            dist/comb-*.zip
            dist/comb-*.zip.sha256
          if-no-files-found: error
