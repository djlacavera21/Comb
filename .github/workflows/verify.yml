name: Verify Comb

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Validate runtime, store disclosures, assets, and attribution boundary
        run: npm run lint
      - name: Run unit tests
        run: node --test tests/*.test.cjs
      - name: Run real-browser adapter and keyboard fixtures
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/run-browser-fixtures.js --require-browser
      - name: Build reproducible runtime and store review kit
        run: npm run release:build
      - name: Upload verified runtime and store review kit
        uses: actions/upload-artifact@v7
        with:
          name: comb-${{ github.sha }}-store-package
          path: |
            dist/comb-*.zip
            dist/comb-*.zip.sha256
          if-no-files-found: error
